// Unity / Firebase androidlib: 기본 생성분이 targetSdk 9 로 잡히는 경우가 있어
// (project.properties 의 target=android-9) minSdk 24 과 충돌하며 경고·빌드 이슈를 낸다.
// 앱 Player Settings 의 compile/target SDK 와 맞춘다.

apply plugin: 'com.android.library'

dependencies {
    implementation fileTree(dir: 'bin', include: ['*.jar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

android {
    namespace "com.google.firebase.app.unity"
    compileSdk 36
    buildToolsVersion = "36.0.0"

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    lint {
        abortOnError false
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}
